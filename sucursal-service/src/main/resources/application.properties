spring.application.name=sucursal-service
server.port=8100

spring.datasource.url=jdbc:mysql://localhost:3306/db_sucursal?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
